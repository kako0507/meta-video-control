<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Mock Stories</title>
  <style>
    body { margin: 0; background: #000; }
    .story-container { position: relative; width: 360px; height: 640px; margin: 0 auto; }
    video { width: 100%; height: 100%; object-fit: cover; background: #222; }
    .story-overlay {
      position: absolute; top: 0; left: 0; right: 0; bottom: 0;
      z-index: 10; background: transparent;
    }
  </style>
</head>
<body>
  <div class="story-container">
    <video id="test-video" src="" loop muted playsinline data-testid="story-video"></video>
    <div class="story-overlay"></div>
  </div>
  <script>
    const v = document.getElementById('test-video')
    Object.defineProperty(v, 'duration', { get: () => 15 })
    let _ct = 0
    Object.defineProperty(v, 'currentTime', { get: () => _ct, set: val => { _ct = val } })
    v.paused = true
    v.play = () => { v.paused = false; return Promise.resolve() }
    v.pause = () => { v.paused = true }
  </script>
</body>
</html>
